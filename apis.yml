aid: aimachautomation
name: AIMACH Automation
description: 'AIMACH Automation is the international brand of Jiangsu Desu Intelligent
  Machinery Co., Ltd. (江苏德速智能机械股份有限公司), a Changzhou, Jiangsu-based manufacturer
  of machine-tool core functional components founded in 2009. Its product lines are
  physical assemblies — CNC tool magazines (刀库), motorized spindles (主轴), rotary /
  index tables (转台) and mineral-cast machine beds (矿物铸件) — which the company states
  account for more than 60% of a machine tool''s total cost. It also builds five-axis
  machining-centre platforms, ultra-precision grinders and turnkey automated production
  lines for automotive and general manufacturing customers, and operates provincial
  R&D centres for CNC machine-tool functional components. The company is pre-IPO and
  runs a Chinese-language corporate site with an investor-relations section; it publishes
  no developer portal, API documentation, SDK, or machine-readable contract of any
  kind.'
